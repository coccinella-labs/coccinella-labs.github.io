name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
      - "postcss.config.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Get build date
        id: date
        run: echo "date=$(date -u +'%b %d, %Y')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BUILD_DATE: ${{ steps.date.outputs.date }}

      - name: Publish to gh-pages
        run: |
          git fetch origin gh-pages
          git worktree add --detach gh-pages-deploy origin/gh-pages
          git -C gh-pages-deploy rm -rf . --quiet
          cp -R out/. gh-pages-deploy/
          git -C gh-pages-deploy add -A
          git -C gh-pages-deploy \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "deploy: ${{ steps.date.outputs.date }}"
          git -C gh-pages-deploy push -f origin HEAD:gh-pages
          git worktree remove --force gh-pages-deploy
